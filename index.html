<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escala da Célula</title>

  <style>
    :root{
      --primary:#1f7a4f;
      --accent:#e23d3d;
      --muted:#5d6d68;
      --line:#d8e6dc;
      --shadow:0 16px 40px rgba(0,0,0,.12);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:linear-gradient(180deg,#8be15f 0%,#dff8d8 100%);
      min-height:100vh;
      color:#18302a;
    }

    .entry{
      position:fixed;
      inset:0;
      z-index:999;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      background:linear-gradient(180deg,#8be15f 0%,#dff8d8 100%);
    }

    .entry-box{
      width:min(520px,100%);
      background:rgba(255,255,255,.9);
      border-radius:32px;
      padding:35px;
      text-align:center;
      box-shadow:var(--shadow);
    }

    .entry-box h1{
      margin:0;
      color:var(--primary);
      font-size:3rem;
    }

    .entry-box p{
      color:var(--muted);
    }

    .entry button{
      width:100%;
      border:none;
      padding:18px;
      border-radius:18px;
      margin-top:14px;
      font-size:1rem;
      font-weight:800;
      cursor:pointer;
    }

    .member{
      background:var(--primary);
      color:white;
    }

    .leader{
      background:white;
      color:var(--primary);
      border:1px solid var(--line);
    }

    .main{
      display:none;
      max-width:1200px;
      margin:0 auto;
      padding:20px;
    }

    .hero{
      background:rgba(255,255,255,.88);
      border-radius:32px;
      padding:28px;
      box-shadow:var(--shadow);
      margin-bottom:20px;
      display:flex;
      justify-content:space-between;
      gap:20px;
      flex-wrap:wrap;
    }

    h2{
      margin:0;
      color:var(--primary);
      font-size:3rem;
    }

    .muted{
      color:var(--muted);
      font-weight:700;
      margin-top:8px;
    }

    .clock{
      text-align:right;
      font-weight:900;
      color:var(--primary);
      font-size:2rem;
    }

    .date{
      color:var(--muted);
      font-size:1rem;
      font-weight:700;
    }

    .card{
      background:rgba(255,255,255,.88);
      border-radius:28px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .card-head{
      padding:18px;
      background:white;
      border-bottom:1px solid var(--line);
      font-weight:900;
      color:var(--primary);
    }

    .card-body{
      padding:18px;
      overflow-x:auto;
    }

    table{
      width:100%;
      border-collapse:collapse;
      background:white;
      min-width:760px;
    }

    th,td{
      border:1px solid var(--line);
      padding:14px;
      text-align:center;
    }

    th{
      background:#f4fff4;
      color:var(--primary);
    }

    td:first-child{
      color:var(--accent);
      font-weight:900;
    }

    @media(max-width:800px){
      h2{font-size:2.2rem}
      .clock{text-align:left}
    }
  </style>
</head>

<body>

<div class="entry" id="entry">
  <div class="entry-box">
    <h1>Bem-vindo</h1>
    <p>Escolha como deseja acessar a escala da célula.</p>

    <button class="member" id="memberBtn">Sou membro</button>
    <button class="leader" id="leaderBtn">Sou líder</button>
  </div>
</div>

<div class="main" id="main">

  <section class="hero">
    <div>
      <h2>Escala da Célula</h2>
      <div class="muted" id="monthInfo">Carregando mês...</div>
    </div>

    <div>
      <div class="clock" id="clock">--:--:--</div>
      <div class="date" id="date">--</div>
    </div>
  </section>

  <section class="card">
    <div class="card-head">
      Escala mensal — Terças-feiras
    </div>

    <div class="card-body">
      <table>
        <thead>
          <tr>
            <th>Data</th>
            <th>Devocional</th>
            <th>Estudo</th>
            <th>Kids</th>
            <th>Lanche</th>
          </tr>
        </thead>

        <tbody id="scheduleBody">
          <tr>
            <td colspan="5">Carregando escala...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

</div>

<script type="module">
import { db } from './firebase.js';

import {
  doc,
  getDoc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const TZ = "America/Sao_Paulo";

const entry = document.getElementById("entry");
const main = document.getElementById("main");
const scheduleBody = document.getElementById("scheduleBody");

document.getElementById("memberBtn").onclick = () => {
  entry.style.display = "none";
  main.style.display = "block";
};

document.getElementById("leaderBtn").onclick = () => {
  window.location.href = "./login.html";
};

function rioDate(){
  return new Date(
    new Date().toLocaleString("en-US", {
      timeZone: TZ
    })
  );
}

function monthKey(){
  const d = rioDate();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2,"0");
  return `${y}-${m}`;
}

function monthLabel(){
  return rioDate().toLocaleDateString("pt-BR", {
    month:"long",
    year:"numeric"
  });
}

function updateClock(){
  const d = rioDate();

  document.getElementById("clock").innerText =
  d.toLocaleTimeString("pt-BR");

  document.getElementById("date").innerText =
  d.toLocaleDateString("pt-BR", {
    weekday:"long",
    day:"2-digit",
    month:"long",
    year:"numeric"
  });
}

function renderSchedule(data){
  if(!data || !data.rows || !data.rows.length){
    scheduleBody.innerHTML = `
      <tr>
        <td colspan="5">Nenhuma escala disponível para este mês.</td>
      </tr>
    `;
    return;
  }

  scheduleBody.innerHTML = "";

  data.rows.forEach(row => {
    scheduleBody.innerHTML += `
      <tr>
        <td>${row.displayDate}</td>
        <td>${row.devocional}</td>
        <td>${row.estudo}</td>
        <td>${row.kids}</td>
        <td>${row.lanche}</td>
      </tr>
    `;
  });
}

async function loadSchedule(){
  const key = monthKey();

  document.getElementById("monthInfo").innerText =
  `Mês atual: ${monthLabel()} | Código: ${key}`;

  const ref = doc(db, "escala", key);
  const snap = await getDoc(ref);

  if(snap.exists()){
    renderSchedule(snap.data());
  }else{
    renderSchedule(null);
  }

  onSnapshot(ref, snapLive => {
    if(snapLive.exists()){
      renderSchedule(snapLive.data());
    }
  });
}

updateClock();
setInterval(updateClock,1000);
loadSchedule();
</script>

</body>
</html>
