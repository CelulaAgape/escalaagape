<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Escala da Célula</title>

  <style>

    :root{
      --bg:#dff8d8;
      --card:#ffffffee;
      --primary:#1f7a4f;
      --accent:#e23d3d;
      --text:#18302a;
      --muted:#5d6d68;
      --line:#d8e6dc;
      --shadow:0 16px 40px rgba(0,0,0,.12);
      --radius:24px;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:
      linear-gradient(
        180deg,
        #8be15f 0%,
        #dff8d8 100%
      );

      min-height:100vh;
      color:var(--text);
    }

    .entry-screen{
      position:fixed;
      inset:0;
      z-index:9999;

      display:flex;
      align-items:center;
      justify-content:center;

      background:
      linear-gradient(
        180deg,
        #8be15f 0%,
        #dff8d8 100%
      );

      padding:20px;
    }

    .entry-box{
      width:min(500px,100%);
      background:rgba(255,255,255,.9);
      border-radius:32px;
      padding:35px;

      text-align:center;

      box-shadow:
      0 20px 50px rgba(0,0,0,.15);
    }

    .entry-box h1{
      margin:0;
      color:var(--primary);
      font-size:3rem;
    }

    .entry-box p{
      color:var(--muted);
      margin-top:10px;
    }

    .entry-buttons{
      display:grid;
      gap:15px;
      margin-top:30px;
    }

    .entry-btn{
      border:none;
      border-radius:18px;
      padding:18px;

      font-size:1rem;
      font-weight:700;

      cursor:pointer;
      transition:.2s;
    }

    .entry-btn:hover{
      transform:translateY(-2px);
    }

    .member{
      background:var(--primary);
      color:white;
    }

    .leader{
      background:white;
      color:var(--primary);
      border:1px solid var(--line);
    }

    .main{
      display:none;
      padding:20px;
      max-width:1100px;
      margin:0 auto;
    }

    .hero{
      background:rgba(255,255,255,.85);
      border-radius:32px;
      padding:30px;
      box-shadow:var(--shadow);

      margin-bottom:20px;
    }

    .hero-top{
      display:flex;
      justify-content:space-between;
      gap:20px;
      flex-wrap:wrap;
      align-items:flex-start;
    }

    h2{
      margin:0;
      color:var(--primary);
      font-size:3rem;
    }

    .clock{
      text-align:right;
    }

    .time{
      font-size:2rem;
      font-weight:900;
      color:var(--primary);
    }

    .date{
      color:var(--muted);
      font-weight:700;
    }

    .card{
      background:rgba(255,255,255,.85);
      border-radius:32px;
      overflow:hidden;
      box-shadow:var(--shadow);
    }

    .card-head{
      padding:20px;
      border-bottom:1px solid var(--line);
      background:white;
      font-weight:700;
    }

    .card-body{
      padding:20px;
    }

    table{
      width:100%;
      border-collapse:collapse;
      background:white;
      border-radius:18px;
      overflow:hidden;
    }

    th, td{
      border:1px solid var(--line);
      padding:14px;
      text-align:center;
    }

    th{
      background:#f4fff4;
    }

    .week{
      margin-top:15px;
      color:var(--muted);
      font-weight:700;
    }

    .loading{
      text-align:center;
      color:var(--muted);
      padding:20px;
    }

    @media(max-width:900px){

      h2{
        font-size:2.2rem;
      }

      .hero-top{
        flex-direction:column;
      }

      .clock{
        text-align:left;
      }

    }

  </style>
</head>

<body>

<div class="entry-screen" id="entryScreen">

  <div class="entry-box">

    <h1>Bem-vindo</h1>

    <p>
      Escolha como deseja acessar
    </p>

    <div class="entry-buttons">

      <button
        class="entry-btn member"
        id="memberBtn"
      >
        Sou membro
      </button>

      <button
        class="entry-btn leader"
        id="leaderBtn"
      >
        Sou líder
      </button>

    </div>

  </div>

</div>

<div class="main" id="mainContent">

  <section class="hero">

    <div class="hero-top">

      <div>
        <h2>
          Escala da Célula
        </h2>

        <div class="week" id="weekInfo">
          Carregando semana...
        </div>
      </div>

      <div class="clock">

        <div class="time" id="time">
          --:--:--
        </div>

        <div class="date" id="date">
          --
        </div>

      </div>

    </div>

  </section>

  <section class="card">

    <div class="card-head">
      Escala Atual
    </div>

    <div class="card-body">

      <table>

        <thead>

          <tr>
            <th>Semana</th>
            <th>Devocional</th>
            <th>Estudo</th>
            <th>Kids</th>
            <th>Lanche</th>
          </tr>

        </thead>

        <tbody id="scheduleBody">

          <tr>
            <td colspan="5" class="loading">
              Carregando escala...
            </td>
          </tr>

        </tbody>

      </table>

    </div>

  </section>

</div>

<script type="module">

import { db } from './firebase.js';

import {
  doc,
  getDoc,
  onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const entryScreen =
document.getElementById("entryScreen");

const mainContent =
document.getElementById("mainContent");

document
.getElementById("memberBtn")
.addEventListener("click", ()=>{

  entryScreen.style.display = "none";
  mainContent.style.display = "block";
});

document
.getElementById("leaderBtn")
.addEventListener("click", ()=>{

  window.location.href =
  "./login.html";
});

function getRioDate(){

  return new Date(
    new Date().toLocaleString(
      "en-US",
      {
        timeZone:"America/Sao_Paulo"
      }
    )
  );
}

function updateClock(){

  const now = getRioDate();

  document.getElementById("time")
  .innerText =
  now.toLocaleTimeString("pt-BR");

  document.getElementById("date")
  .innerText =
  now.toLocaleDateString(
    "pt-BR",
    {
      weekday:"long",
      year:"numeric",
      month:"long",
      day:"numeric"
    }
  );
}

setInterval(updateClock,1000);
updateClock();

function getWeekKey(){

  const date = getRioDate();

  const firstDay =
  new Date(date.getFullYear(),0,1);

  const days =
  Math.floor((date - firstDay)/86400000);

  const week =
  Math.ceil((days + firstDay.getDay()+1)/7);

  return `${date.getFullYear()}-W${week}`;
}

const weekKey = getWeekKey();

document.getElementById("weekInfo")
.innerText =
`Semana atual: ${weekKey}`;

const scheduleBody =
document.getElementById("scheduleBody");

async function loadSchedule(){

  const snap =
  await getDoc(
    doc(db,"escala",weekKey)
  );

  if(!snap.exists()){

    scheduleBody.innerHTML = `
      <tr>
        <td colspan="5">
          Nenhuma escala disponível.
        </td>
      </tr>
    `;

    return;
  }

  const data = snap.data();

  scheduleBody.innerHTML = `
    <tr>
      <td>${data.weekKey}</td>
      <td>${data.devocional}</td>
      <td>${data.estudo}</td>
      <td>${data.kids}</td>
      <td>${data.lanche}</td>
    </tr>
  `;
}

onSnapshot(
  doc(db,"escala",weekKey),
  (snap)=>{

    if(!snap.exists())
    return;

    const data = snap.data();

    scheduleBody.innerHTML = `
      <tr>
        <td>${data.weekKey}</td>
        <td>${data.devocional}</td>
        <td>${data.estudo}</td>
        <td>${data.kids}</td>
        <td>${data.lanche}</td>
      </tr>
    `;
  }
);

loadSchedule();

</script>

</body>
</html>
