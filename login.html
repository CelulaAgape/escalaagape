<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Admin</title>
  <style>
    body{
      margin:0;
      font-family:Arial,sans-serif;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:linear-gradient(180deg,#8be15f 0%,#dff8d8 100%);
    }
    .box{
      width:min(420px,92vw);
      background:#fff;
      border-radius:24px;
      padding:24px;
      box-shadow:0 16px 40px rgba(0,0,0,.12);
    }
    h1{margin:0 0 18px;color:#1f7a4f}
    input,button{
      width:100%;
      padding:14px;
      border-radius:14px;
      border:1px solid #d8e6dc;
      margin-top:10px;
      font:inherit;
      box-sizing:border-box;
    }
    button{
      background:#1f7a4f;
      color:#fff;
      font-weight:700;
      border:none;
      cursor:pointer;
    }
    .muted{color:#5d6d68;font-size:.95rem}
  </style>
</head>
<body>
  <div class="box">
    <h1>Login do Admin</h1>
    <div class="muted">Entre para abrir o painel administrativo.</div>
    <input id="email" type="email" placeholder="E-mail" />
    <input id="senha" type="password" placeholder="Senha" />
    <button id="entrar">Entrar</button>
  </div>

  <script type="module">
    import { auth } from './firebase.js';
    import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    const email = document.getElementById('email');
    const senha = document.getElementById('senha');
    const entrar = document.getElementById('entrar');

    onAuthStateChanged(auth, (user) => {
      if (user) window.location.href = './admin.html';
    });

    entrar.addEventListener('click', async () => {
      try {
        await signInWithEmailAndPassword(auth, email.value.trim(), senha.value);
        window.location.href = './admin.html';
      } catch (e) {
        alert('Login inválido.');
      }
    });
  </script>
</body>
</html>
