<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Admin</title>

  <style>
    :root{
      --bg:#dff8d8;
      --card:#ffffffee;
      --primary:#1f7a4f;
      --accent:#e23d3d;
      --text:#18302a;
      --muted:#5d6d68;
      --line:#d8e6dc;
      --shadow:0 16px 40px rgba(0,0,0,.12);
      --radius:24px;
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Arial,sans-serif;
      color:var(--text);
      background:linear-gradient(180deg,#8be15f 0%,#dff8d8 100%);
      min-height:100vh;
    }

    .wrap{
      max-width:1200px;
      margin:0 auto;
      padding:20px;
    }

    .top{
      background:rgba(255,255,255,.85);
      border-radius:30px;
      padding:24px;
      box-shadow:var(--shadow);
      margin-bottom:20px;

      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:20px;
    }

    h1{
      margin:0;
      color:var(--primary);
    }

    .muted{
      color:var(--muted);
    }

    .btn{
      border:none;
      padding:14px 18px;
      border-radius:14px;
      font-weight:700;
      cursor:pointer;
      transition:.2s;
    }

    .btn:hover{
      transform:translateY(-2px);
    }

    .primary{
      background:var(--primary);
      color:white;
    }

    .secondary{
      background:white;
      border:1px solid var(--line);
      color:var(--primary);
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:20px;
    }

    .card{
      background:rgba(255,255,255,.85);
      border-radius:var(--radius);
      overflow:hidden;
      box-shadow:var(--shadow);
    }

    .head{
      padding:18px;
      border-bottom:1px solid var(--line);
      background:white;
      font-weight:700;
    }

    .body{
      padding:18px;
    }

    input, select{
      width:100%;
      padding:14px;
      border-radius:14px;
      border:1px solid var(--line);
      margin-bottom:10px;
      font:inherit;
    }

    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .list{
      display:grid;
      gap:10px;
      margin-top:16px;
    }

    .item{
      background:white;
      border:1px solid var(--line);
      border-radius:16px;
      padding:14px;

      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }

    table{
      width:100%;
      border-collapse:collapse;
      background:white;
      border-radius:18px;
      overflow:hidden;
    }

    th, td{
      padding:12px;
      border:1px solid var(--line);
      text-align:center;
    }

    th{
      background:#f4fff4;
    }

    .danger{
      background:#ffefef;
      color:#a80000;
      border:none;
    }

    @media(max-width:900px){
      .grid{
        grid-template-columns:1fr;
      }

      .row{
        grid-template-columns:1fr;
      }
    }
  </style>
</head>
<body>

<div class="wrap">

  <section class="top">
    <div>
      <h1>Painel do Líder</h1>
      <div id="userInfo" class="muted">
        Verificando login...
      </div>
    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button id="generateBtn" class="btn primary">
        Gerar Escala
      </button>

      <button id="logoutBtn" class="btn secondary">
        Sair
      </button>
    </div>
  </section>

  <div class="grid">

    <section class="card">

      <div class="head">
        Adicionar Casal
      </div>

      <div class="body">

        <div class="row">
          <input id="nome1" placeholder="Nome 1">
          <input id="nome2" placeholder="Nome 2">
        </div>

        <select id="ativo">
          <option value="true">
            Ativo
          </option>

          <option value="false">
            Inativo
          </option>
        </select>

        <button id="addBtn" class="btn primary">
          Adicionar Casal
        </button>

        <div id="couplesList" class="list"></div>

      </div>

    </section>

    <section class="card">

      <div class="head">
        Escala da Semana
      </div>

      <div class="body">

        <table>
          <thead>
            <tr>
              <th>Semana</th>
              <th>Devocional</th>
              <th>Estudo</th>
              <th>Kids</th>
              <th>Lanche</th>
            </tr>
          </thead>

          <tbody id="scheduleBody"></tbody>
        </table>

      </div>

    </section>

  </div>

</div>

<script type="module">

import { auth, db } from './firebase.js';

import {
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

import {
  collection,
  addDoc,
  getDocs,
  doc,
  deleteDoc,
  updateDoc,
  setDoc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const allowedEmail = "celulaagapeie@gmail.com";

const couplesList =
document.getElementById("couplesList");

const scheduleBody =
document.getElementById("scheduleBody");

let couples = [];

function weekKey(){

  const date = new Date();

  const firstDay =
  new Date(date.getFullYear(),0,1);

  const days =
  Math.floor((date - firstDay) / 86400000);

  const week =
  Math.ceil((days + firstDay.getDay()+1)/7);

  return `${date.getFullYear()}-W${week}`;
}

function shuffle(array){

  let currentIndex = array.length;

  while(currentIndex != 0){

    const randomIndex =
    Math.floor(Math.random() * currentIndex);

    currentIndex--;

    [array[currentIndex], array[randomIndex]] = [
      array[randomIndex],
      array[currentIndex]
    ];
  }

  return array;
}

async function loadCouples(){

  const snap =
  await getDocs(collection(db,"casais"));

  couples =
  snap.docs.map(doc => ({
    id:doc.id,
    ...doc.data()
  }));

  renderCouples();
}

function renderCouples(){

  couplesList.innerHTML = "";

  couples.forEach(casal => {

    const div =
    document.createElement("div");

    div.className = "item";

    div.innerHTML = `
      <div>
        <strong>
          ${casal.nome1} e ${casal.nome2}
        </strong>

        <div class="muted">
          ${casal.ativo ? "Ativo" : "Inativo"}
        </div>
      </div>

      <div style="display:flex;gap:10px;flex-wrap:wrap;">

        <button
          class="btn secondary"
          onclick="toggleCasal('${casal.id}', ${casal.ativo})"
        >
          ${casal.ativo ? "Desativar" : "Ativar"}
        </button>

        <button
          class="btn danger"
          onclick="deleteCasal('${casal.id}')"
        >
          Excluir
        </button>

      </div>
    `;

    couplesList.appendChild(div);
  });
}

window.deleteCasal = async(id)=>{

  if(!confirm("Excluir casal?"))
  return;

  await deleteDoc(doc(db,"casais",id));

  loadCouples();
}

window.toggleCasal = async(id,ativo)=>{

  await updateDoc(doc(db,"casais",id),{
    ativo:!ativo
  });

  loadCouples();
}

document
.getElementById("addBtn")
.addEventListener("click", async()=>{

  const nome1 =
  document.getElementById("nome1").value;

  const nome2 =
  document.getElementById("nome2").value;

  const ativo =
  document.getElementById("ativo").value === "true";

  if(!nome1 || !nome2){

    alert("Preencha os nomes.");
    return;
  }

  await addDoc(collection(db,"casais"),{
    nome1,
    nome2,
    ativo
  });

  document.getElementById("nome1").value="";
  document.getElementById("nome2").value="";

  loadCouples();
});

document
.getElementById("generateBtn")
.addEventListener("click", async()=>{

  const ativos =
  couples.filter(c=>c.ativo);

  if(ativos.length < 4){

    alert("Precisa de 4 casais ativos.");
    return;
  }

  const embaralhados =
  shuffle([...ativos]);

  const escolhidos =
  embaralhados.slice(0,4);

  const data = {
    weekKey:weekKey(),
    devocional:
      `${escolhidos[0].nome1} e ${escolhidos[0].nome2}`,

    estudo:
      `${escolhidos[1].nome1} e ${escolhidos[1].nome2}`,

    kids:
      `${escolhidos[2].nome1} e ${escolhidos[2].nome2}`,

    lanche:
      `${escolhidos[3].nome1} e ${escolhidos[3].nome2}`
  };

  await setDoc(
    doc(db,"escala",weekKey()),
    data
  );

  loadSchedule();

  alert("Escala gerada.");
});

async function loadSchedule(){

  const snap =
  await getDoc(
    doc(db,"escala",weekKey())
  );

  scheduleBody.innerHTML = "";

  if(!snap.exists()){

    scheduleBody.innerHTML = `
      <tr>
        <td colspan="5">
          Nenhuma escala.
        </td>
      </tr>
    `;

    return;
  }

  const data = snap.data();

  scheduleBody.innerHTML = `
    <tr>
      <td>${data.weekKey}</td>
      <td>${data.devocional}</td>
      <td>${data.estudo}</td>
      <td>${data.kids}</td>
      <td>${data.lanche}</td>
    </tr>
  `;
}

onAuthStateChanged(auth, async(user)=>{

  if(!user){

    window.location.href = "./login.html";
    return;
  }

  if(user.email !== allowedEmail){

    alert("Este acesso não é permitido para este usuário");

    await signOut(auth);

    window.location.href = "./login.html";

    return;
  }

  document.getElementById("userInfo")
  .innerText =
  `Logado como ${user.email}`;

  loadCouples();
  loadSchedule();
});

document
.getElementById("logoutBtn")
.addEventListener("click", async()=>{

  await signOut(auth);

  window.location.href =
  "./login.html";
});

</script>

</body>
</html>
