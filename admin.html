<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Escala da Célula</title>

  <style>
    :root{
      --primary:#1f7a4f;
      --accent:#e23d3d;
      --muted:#5d6d68;
      --line:#d8e6dc;
      --shadow:0 16px 40px rgba(0,0,0,.12);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Arial,sans-serif;
      background:linear-gradient(180deg,#8be15f 0%,#dff8d8 100%);
      min-height:100vh;
      color:#18302a;
    }

    .wrap{
      max-width:1200px;
      margin:0 auto;
      padding:20px;
    }

    .top{
      background:rgba(255,255,255,.88);
      border-radius:32px;
      padding:25px;
      box-shadow:var(--shadow);
      margin-bottom:20px;
      display:flex;
      justify-content:space-between;
      gap:20px;
      flex-wrap:wrap;
      align-items:center;
    }

    h1{
      margin:0;
      color:var(--primary);
    }

    .muted{
      color:var(--muted);
      font-weight:700;
    }

    .btn{
      border:none;
      padding:13px 16px;
      border-radius:14px;
      font-weight:800;
      cursor:pointer;
      margin:3px;
    }

    .primary{
      background:var(--primary);
      color:white;
    }

    .secondary{
      background:white;
      color:var(--primary);
      border:1px solid var(--line);
    }

    .danger{
      background:#ffefef;
      color:#b00000;
    }

    .grid{
      display:grid;
      grid-template-columns:.8fr 1.2fr;
      gap:20px;
    }

    .card{
      background:rgba(255,255,255,.88);
      border-radius:28px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .head{
      padding:18px;
      background:white;
      border-bottom:1px solid var(--line);
      font-weight:900;
      color:var(--primary);
    }

    .body{
      padding:18px;
    }

    input,select{
      width:100%;
      padding:14px;
      border-radius:14px;
      border:1px solid var(--line);
      margin-bottom:10px;
      font:inherit;
    }

    .row{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }

    .list{
      display:grid;
      gap:10px;
      margin-top:15px;
    }

    .item{
      background:white;
      border:1px solid var(--line);
      border-radius:16px;
      padding:13px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }

    table{
      width:100%;
      border-collapse:collapse;
      background:white;
      min-width:760px;
    }

    th,td{
      border:1px solid var(--line);
      padding:12px;
      text-align:center;
    }

    th{
      background:#f4fff4;
      color:var(--primary);
    }

    td:first-child{
      color:var(--accent);
      font-weight:900;
    }

    .table-wrap{
      overflow-x:auto;
    }

    @media(max-width:900px){
      .grid{grid-template-columns:1fr}
      .row{grid-template-columns:1fr}
    }
  </style>
</head>

<body>

<div class="wrap">

  <section class="top">
    <div>
      <h1>Painel do Líder</h1>
      <div class="muted" id="userInfo">Verificando login...</div>
      <div class="muted" id="monthInfo">Carregando mês...</div>
    </div>

    <div>
      <button class="btn primary" id="generateBtn">
        Gerar escala do mês
      </button>

      <button class="btn secondary" id="logoutBtn">
        Sair
      </button>
    </div>
  </section>

  <div class="grid">

    <section class="card">
      <div class="head">Casais da célula</div>

      <div class="body">
        <div class="row">
          <input id="nome1" placeholder="Nome 1">
          <input id="nome2" placeholder="Nome 2">
        </div>

        <select id="ativo">
          <option value="true">Ativo / pode ser escalado</option>
          <option value="false">Inativo / não entra na escala</option>
        </select>

        <button class="btn primary" id="addBtn">
          Adicionar casal
        </button>

        <div id="couplesList" class="list"></div>
      </div>
    </section>

    <section class="card">
      <div class="head">Escala mensal — Terças-feiras</div>

      <div class="body table-wrap">
        <table>
          <thead>
            <tr>
              <th>Data</th>
              <th>Devocional</th>
              <th>Estudo</th>
              <th>Kids</th>
              <th>Lanche</th>
            </tr>
          </thead>

          <tbody id="scheduleBody">
            <tr>
              <td colspan="5">Nenhuma escala carregada.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </div>

</div>

<script type="module">
import { auth, db } from './firebase.js';

import {
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

import {
  collection,
  addDoc,
  getDocs,
  doc,
  deleteDoc,
  updateDoc,
  setDoc,
  getDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const allowedEmail = "celulaagapeie@gmail.com";
const TZ = "America/Sao_Paulo";

const couplesList = document.getElementById("couplesList");
const scheduleBody = document.getElementById("scheduleBody");

let couples = [];

function rioDate(){
  return new Date(
    new Date().toLocaleString("en-US", {
      timeZone: TZ
    })
  );
}

function monthKey(date = rioDate()){
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2,"0");
  return `${y}-${m}`;
}

function previousMonthKey(){
  const d = rioDate();
  d.setMonth(d.getMonth() - 1);
  return monthKey(d);
}

function monthLabel(){
  return rioDate().toLocaleDateString("pt-BR", {
    month:"long",
    year:"numeric"
  });
}

function getTuesdaysOfCurrentMonth(){
  const now = rioDate();
  const year = now.getFullYear();
  const month = now.getMonth();

  const dates = [];
  const d = new Date(year, month, 1);

  while(d.getMonth() === month){
    if(d.getDay() === 2){
      dates.push(new Date(d));
    }

    d.setDate(d.getDate() + 1);
  }

  return dates;
}

function formatDate(d){
  return d.toLocaleDateString("pt-BR", {
    day:"2-digit",
    month:"2-digit"
  });
}

function coupleName(c){
  return `${c.nome1} e ${c.nome2}`;
}

function shuffle(array){
  const arr = [...array];

  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }

  return arr;
}

async function loadCouples(){
  const snap = await getDocs(collection(db,"casais"));

  couples = snap.docs.map(d => ({
    id:d.id,
    ...d.data()
  }));

  renderCouples();
}

function renderCouples(){
  couplesList.innerHTML = "";

  if(!couples.length){
    couplesList.innerHTML = `<div class="muted">Nenhum casal cadastrado.</div>`;
    return;
  }

  couples.forEach(c => {
    const div = document.createElement("div");
    div.className = "item";

    div.innerHTML = `
      <div>
        <strong>${c.nome1} e ${c.nome2}</strong>
        <div class="muted">${c.ativo ? "Ativo" : "Inativo"}</div>
      </div>

      <div>
        <button class="btn secondary" onclick="toggleCouple('${c.id}', ${c.ativo})">
          ${c.ativo ? "Desativar" : "Ativar"}
        </button>

        <button class="btn danger" onclick="deleteCouple('${c.id}')">
          Excluir
        </button>
      </div>
    `;

    couplesList.appendChild(div);
  });
}

window.toggleCouple = async function(id, ativo){
  await updateDoc(doc(db,"casais",id), {
    ativo:!ativo
  });

  await loadCouples();
};

window.deleteCouple = async function(id){
  if(!confirm("Excluir este casal?")) return;

  await deleteDoc(doc(db,"casais",id));

  await loadCouples();
};

document.getElementById("addBtn").onclick = async () => {
  const nome1 = document.getElementById("nome1").value.trim();
  const nome2 = document.getElementById("nome2").value.trim();
  const ativo = document.getElementById("ativo").value === "true";

  if(!nome1 || !nome2){
    alert("Preencha os dois nomes.");
    return;
  }

  await addDoc(collection(db,"casais"), {
    nome1,
    nome2,
    ativo,
    criadoEm:serverTimestamp()
  });

  document.getElementById("nome1").value = "";
  document.getElementById("nome2").value = "";

  await loadCouples();
};

async function loadPreviousMonthSchedule(){
  const ref = doc(db, "escala", previousMonthKey());
  const snap = await getDoc(ref);

  if(!snap.exists()) return null;

  return snap.data();
}

function pickCouple(pool, blockedIds = []){
  const available = pool.filter(c => !blockedIds.includes(c.id));

  if(available.length){
    return shuffle(available)[0];
  }

  return shuffle(pool)[0];
}

async function generateMonthlySchedule(){

  const active = couples.filter(c => c.ativo);

  if(active.length < 4){
    alert("Você precisa de pelo menos 4 casais ativos.");
    return;
  }

  const tuesdays = getTuesdaysOfCurrentMonth();
  const previous = await loadPreviousMonthSchedule();

  const rows = [];

  let lastIds = {
    devocional:null,
    estudo:null,
    kids:null,
    lanche:null
  };

  if(previous?.rows?.length){
    const lastPreviousRow = previous.rows[previous.rows.length - 1];

    if(lastPreviousRow?.ids){
      lastIds = {
        devocional:lastPreviousRow.ids.devocional || null,
        estudo:lastPreviousRow.ids.estudo || null,
        kids:lastPreviousRow.ids.kids || null,
        lanche:lastPreviousRow.ids.lanche || null
      };
    }
  }

  tuesdays.forEach((date) => {

    const usedToday = [];

    const devocional = pickCouple(active, [
      lastIds.devocional,
      ...usedToday
    ]);
    usedToday.push(devocional.id);

    const estudo = pickCouple(active, [
      lastIds.estudo,
      ...usedToday
    ]);
    usedToday.push(estudo.id);

    const kids = pickCouple(active, [
      lastIds.kids,
      ...usedToday
    ]);
    usedToday.push(kids.id);

    const lanche = pickCouple(active, [
      lastIds.lanche,
      ...usedToday
    ]);
    usedToday.push(lanche.id);

    rows.push({
      dateISO: date.toISOString(),
      displayDate: formatDate(date),

      devocional: coupleName(devocional),
      estudo: coupleName(estudo),
      kids: coupleName(kids),
      lanche: coupleName(lanche),

      ids:{
        devocional:devocional.id,
        estudo:estudo.id,
        kids:kids.id,
        lanche:lanche.id
      }
    });

    lastIds = {
      devocional:devocional.id,
      estudo:estudo.id,
      kids:kids.id,
      lanche:lanche.id
    };

  });

  const data = {
    monthKey:monthKey(),
    monthLabel:monthLabel(),
    rows,
    updatedAt:serverTimestamp()
  };

  await setDoc(doc(db,"escala",monthKey()), data);

  renderSchedule(data);

  alert("Escala mensal gerada com sucesso.");
}

function renderSchedule(data){
  if(!data || !data.rows || !data.rows.length){
    scheduleBody.innerHTML = `
      <tr>
        <td colspan="5">Nenhuma escala criada para este mês.</td>
      </tr>
    `;
    return;
  }

  scheduleBody.innerHTML = "";

  data.rows.forEach(row => {
    scheduleBody.innerHTML += `
      <tr>
        <td>${row.displayDate}</td>
        <td>${row.devocional}</td>
        <td>${row.estudo}</td>
        <td>${row.kids}</td>
        <td>${row.lanche}</td>
      </tr>
    `;
  });
}

async function loadSchedule(){
  document.getElementById("monthInfo").innerText =
  `Mês atual: ${monthLabel()} | Código: ${monthKey()}`;

  const snap = await getDoc(doc(db,"escala",monthKey()));

  if(snap.exists()){
    renderSchedule(snap.data());
  }else{
    renderSchedule(null);
  }
}

document.getElementById("generateBtn").onclick = generateMonthlySchedule;

document.getElementById("logoutBtn").onclick = async () => {
  await signOut(auth);
  window.location.href = "./login.html";
};

onAuthStateChanged(auth, async user => {
  if(!user){
    window.location.href = "./login.html";
    return;
  }

  if(user.email !== allowedEmail){
    alert("Este acesso não é permitido para este usuário.");
    await signOut(auth);
    window.location.href = "./login.html";
    return;
  }

  document.getElementById("userInfo").innerText =
  `Logado como ${user.email}`;

  await loadCouples();
  await loadSchedule();
});
</script>

</body>
</html>
